# sia-nginx  10.10.10.1 (enp0s8), NAT VirtualBox en enp0s3.
# Windows no reenvía puertos: VirtualBox ya manda 80 y 443 al NAT de esta VM.
# Publica el Vue compilado y reenvía la API a sia-app (10.10.10.2:8000).
#
#   sudo mkdir -p /var/www/sia /etc/nginx/ssl
#   sudo cp dist/* /var/www/sia/
#   sudo bash deploy/nginx/certificado.sh
#   sudo cp deploy/nginx/sia.conf /etc/nginx/sites-available/sia
#   sudo ln -s /etc/nginx/sites-available/sia /etc/nginx/sites-enabled/sia
#   sudo nginx -t && sudo systemctl reload nginx

upstream sia_app {
    server 10.10.10.2:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/sia.crt;
    ssl_certificate_key /etc/nginx/ssl/sia.key;

    root /var/www/sia;
    index index.html;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://sia_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://sia_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://sia_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://sia_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
